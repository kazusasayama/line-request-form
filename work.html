<!DOCTYPE html><html lang='ja'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<style>
body{font-family:Meiryo,sans-serif;background:#f3f5f7;margin:0}
.wrap{max-width:700px;margin:20px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
h1{background:#06C755;color:#fff;padding:15px;border-radius:8px}
label{display:block;font-weight:bold;margin-top:14px}
input,select,textarea{width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
textarea{height:90px}
.sec{background:#eef8ef;padding:12px;border-radius:8px;margin-top:18px}
/* 住所候補ドロップダウン */
.suggestions{border:1px solid #ccc;border-radius:6px;background:#fff;max-height:200px;overflow:auto;margin-top:4px}
.suggestion-item{padding:8px 10px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.suggestion-item:last-child{border-bottom:none}
.suggestion-label{font-weight:600}
.suggestion-value{display:block;color:#666;font-size:0.9em}
button{width:100%;padding:14px;margin-top:20px;background:#06C755;color:#fff;border:none;border-radius:8px;font-size:18px}
.req{color:#d00}
.opt{color:#777;font-size:.9em}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
async function initLiff() {
    try {

        await liff.init({
            liffId: "2011075821-RCsbGkwo"
        });

        console.log("LIFF初期化成功");

        const profile = await liff.getProfile();

        console.log(profile);

        document.getElementById("user_id").value = profile.userId;
        document.getElementById("display_name").value = profile.displayName;

    } catch (e) {

        console.error(e);

        alert("LIFFエラー\n" + e);

    }
}
function sw(){
 let v=document.getElementById('occ').value;
 document.getElementById('occ_in').style.display=v=='in'?'block':'none';
 document.getElementById('occ_out').style.display=v=='out'?'block':'none';
}
window.onload = function() {
    sw();
    initLiff();

    // 住所候補の準備（address_list.json を読み込む）
    (function(){
        let addressList = [];
        let selectedCity = '';
        let selectedWard = '';

        fetch('address_list.json').then(function(r){ if(!r.ok) throw new Error('fetch failed'); return r.json(); }).then(function(data){ if(Array.isArray(data)) addressList = data; }).catch(function(e){ console.warn('address_list.json load failed', e); addressList = []; });

        function getElem(id){ return document.getElementById(id); }
        const input = getElem('address');
        const box = getElem('address-suggestions');

        function hide(){ if(box) box.style.display='none'; }
        function show(){ if(box) box.style.display='block'; }

        function normalizeText(v){
            return (v || '').replace(/[ 　]/g, '').toLowerCase();
        }

        function escapeRegExp(v){
            return String(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function splitAddress(value){
            const full = (value || '').trim();
            const cityMatch = full.match(/^(.+市)/);
            const city = cityMatch ? cityMatch[1] : '';
            const wardMatch = city ? full.match(new RegExp('^' + escapeRegExp(city) + '(.+区)')) : null;
            const ward = wardMatch ? wardMatch[1] : '';
            const town = city && ward ? full.slice(city.length + ward.length) : (city ? full.slice(city.length) : full);
            return { city: city, ward: ward, town: town };
        }

        function matchRank(candidate, query){
            const q = normalizeText(query);
            if(!q) return 99;

            const target = normalizeText(candidate || '');
            const parts = [target];
            const parsed = splitAddress(candidate || '');
            if(parsed.city) parts.push(normalizeText(parsed.city));
            if(parsed.ward) parts.push(normalizeText(parsed.ward));
            if(parsed.town) parts.push(normalizeText(parsed.town));

            const startsWithQuery = parts.some(function(part){
                return part === q || part.indexOf(q) === 0;
            });

            if(!startsWithQuery) return 3;
            if(target === q) return 0;
            return 1;
        }

        function uniqueByValue(items){
            const seen = new Set();
            return items.filter(function(item){
                const key = item.value || '';
                if(!key || seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        function sortCandidates(items, query){
            return items.sort(function(a,b){
                const aScore = Math.min(matchRank(a.label || '', query), matchRank(a.value || '', query));
                const bScore = Math.min(matchRank(b.label || '', query), matchRank(b.value || '', query));
                if(aScore !== bScore) return aScore - bScore;
                if((a.groupPriority || 99) !== (b.groupPriority || 99)) return (a.groupPriority || 99) - (b.groupPriority || 99);
                return (a.label || a.value).localeCompare(b.label || b.value, 'ja');
            }).slice(0, 20);
        }

        function getCitySuggestions(query){
            const cities = Array.from(new Set(addressList.map(function(it){ return splitAddress(it.value).city; }).filter(Boolean))).map(function(city){
                return { label: city, value: city, groupPriority: 0 };
            });
            return sortCandidates(cities.filter(function(item){
                return Math.min(matchRank(item.label, query), matchRank(item.value, query)) < 3;
            }), query);
        }

        function getWardSuggestions(cityName, query){
            const wards = Array.from(new Set(addressList.filter(function(it){
                return splitAddress(it.value).city === cityName;
            }).map(function(it){
                const p = splitAddress(it.value);
                return p.city + p.ward;
            }).filter(Boolean))).map(function(fullWard){
                const p = splitAddress(fullWard);
                return { label: p.ward, value: fullWard, groupPriority: 1 };
            });
            return sortCandidates(wards.filter(function(item){
                return Math.min(matchRank(item.label, query), matchRank(item.value, query)) < 3;
            }), query);
        }

        function getTownSuggestions(cityName, wardName, query){
            const items = addressList.filter(function(it){
                const p = splitAddress(it.value);
                if(cityName && wardName) return p.city === cityName && p.ward === wardName;
                if(cityName) return p.city === cityName;
                return true;
            }).map(function(it){
                return { label: it.label || '', value: it.value || '', groupPriority: 2 };
            });
            return sortCandidates(uniqueByValue(items).filter(function(item){
                return Math.min(matchRank(item.label, query), matchRank(item.value, query)) < 3;
            }), query);
        }

        function getSuggestions(query){
            const keyword = (query || '').trim();
            if(!addressList.length) return [];

            const directMatches = addressList.map(function(it){
                return { label: it.label || '', value: it.value || '', groupPriority: 2 };
            }).filter(function(item){
                return Math.min(matchRank(item.label, keyword), matchRank(item.value, keyword)) < 3;
            });

            if(selectedCity && selectedWard){
                return getTownSuggestions(selectedCity, selectedWard, keyword);
            }

            if(selectedCity && !selectedWard){
                if(!keyword) return getWardSuggestions(selectedCity, '');
                const wardMatches = getWardSuggestions(selectedCity, keyword);
                if(wardMatches.length) return wardMatches;
                const directWithinCity = getTownSuggestions(selectedCity, '', keyword);
                return directWithinCity.length ? directWithinCity : directMatches;
            }

            const cityMatches = getCitySuggestions(keyword);
            if(keyword && cityMatches.length){
                return cityMatches;
            }

            const wardMatches = !keyword ? [] : Array.from(new Set(addressList.map(function(it){
                const p = splitAddress(it.value);
                return p.city && p.ward ? p.city + p.ward : '';
            }).filter(Boolean))).map(function(fullWard){
                const p = splitAddress(fullWard);
                return { label: p.ward, value: fullWard, groupPriority: 1 };
            }).filter(function(item){
                return Math.min(matchRank(item.label, keyword), matchRank(item.value, keyword)) < 3;
            });

            if(keyword && wardMatches.length){
                return sortCandidates(wardMatches, keyword);
            }

            return directMatches.length ? sortCandidates(directMatches, keyword) : cityMatches;
        }

        function render(q){
            if(!box) return;
            const keyword = (q || '').trim();
            const suggestions = getSuggestions(keyword);
            if(!keyword && !suggestions.length){ box.innerHTML=''; hide(); return; }
            if(!suggestions.length){ box.innerHTML=''; hide(); return; }

            box.innerHTML = suggestions.map(function(it){
                const label = it.label || it.value;
                const value = it.value || '';
                const type = value === selectedCity ? 'city' : (value === (selectedCity + (selectedWard || '')) ? 'ward' : 'town');
                return '<div class="suggestion-item" data-value="'+value+'" data-label="'+label+'" data-type="'+type+'">'
                    +'<div class="suggestion-label">'+label+'</div>'
                    +'<div class="suggestion-value">'+value+'</div>'
                    +'</div>';
            }).join('');
            show();
        }

        function syncSelectionContext(value){
            const current = (value || '').trim();
            if(!current){
                selectedCity = '';
                selectedWard = '';
                return;
            }

            const cityMatch = current.match(/^(.+市)/);
            if(cityMatch){
                const city = cityMatch[1];
                const wardMatch = current.match(new RegExp('^' + escapeRegExp(city) + '(.+区)'));
                if(wardMatch){
                    selectedCity = city;
                    selectedWard = wardMatch[1];
                    return;
                }
                selectedCity = city;
                selectedWard = '';
                return;
            }

            selectedCity = '';
            selectedWard = '';
        }

        if(input){
            input.addEventListener('input', function(e){
                syncSelectionContext(e.target.value);
                render(e.target.value);
            });
            input.addEventListener('focus', function(e){
                syncSelectionContext(e.target.value);
                render(e.target.value);
            });
        }

        document.addEventListener('click', function(e){
            if(!box) return;
            const item = e.target.closest && e.target.closest('.suggestion-item');
            if(item && input){
                const value = item.getAttribute('data-value') || '';
                const type = item.getAttribute('data-type') || 'town';

                if(type === 'city'){
                    selectedCity = value;
                    selectedWard = '';
                    input.value = value;
                    render('');
                    input.focus();
                    return;
                }

                if(type === 'ward'){
                    const parts = splitAddress(value);
                    selectedCity = parts.city;
                    selectedWard = parts.ward;
                    input.value = value;
                    render('');
                    input.focus();
                    return;
                }

                selectedCity = '';
                selectedWard = '';
                input.value = value;
                hide();
                input.focus();
                return;
            }

            if(!box.contains(e.target) && e.target !== input) hide();
        });
    })();

    try {
        const form = document.querySelector('form');
        if (form) {
            const submitBtn = form.querySelector('button[type="submit"], button');
            form.addEventListener('submit', function () {
                try {
                    if (!submitBtn) return;
                    // ボタンを無効化して表示を変更（多重送信防止）
                    submitBtn.dataset._origText = submitBtn.textContent;
                    submitBtn.textContent = '送信中...';
                    submitBtn.disabled = true;

                    // ページ遷移が発生しなかった（送信エラー等）場合のみボタンを戻す仕組み
                    const restoreTimer = setTimeout(function () {
                        try {
                            submitBtn.disabled = false;
                            submitBtn.textContent = submitBtn.dataset._origText || '送信';
                        } catch (e) {
                            console.error(e);
                        }
                    }, 10000);

                    // 正常にページ遷移する場合は beforeunload でタイマーをクリア
                    const clearOnUnload = function () {
                        clearTimeout(restoreTimer);
                        window.removeEventListener('beforeunload', clearOnUnload);
                    };
                    window.addEventListener('beforeunload', clearOnUnload);

                } catch (e) {
                    console.error(e);
                }
            });
        }
    } catch (e) {
        console.error(e);
    }
};
</script>
</head>
<body><div class='wrap'>
<form action="https://bluish-slacker-hexagon.ngrok-free.dev/submit"
      method="post"
      enctype="multipart/form-data">
<input type="hidden" name="user_id" id="user_id">
<input type="hidden" name="display_name" id="display_name">
<h1>作業依頼フォーム</h1>
<label>作業内容 <span class='req'>必須</span></label>
<textarea name="work" placeholder='例）洗浄便座交換'></textarea>
<label>住所 <span class='req'>必須</span></label>
<input id="address" name="address" autocomplete="off">
<div id="address-suggestions" class="suggestions" style="display:none"></div>
<label>物件名 <span class='req'>必須</span></label><input name="property">
<label>部屋番号 <span class='req'>必須</span></label><input name="room" type="tel" inputmode="numeric">
<label>入居状況 <span class='req'>必須</span></label>
<select id='occ' name="occupancy" onchange='sw()'><option value='in'>入居中</option><option value='out'>空室</option></select>
<div id='occ_in' class='sec'>
<label>入居者名</label><input name="resident" placeholder='例）山田 太郎'>
<label>電話番号</label><input name="phone" type="tel" inputmode="numeric" placeholder='例）090-1234-5678'>
</div>
<div id='occ_out' class='sec'>
<label>オートロック番号</label><input name="autolock" placeholder='例）1234#'>
<label>鍵番号</label><input name="key_number" placeholder='例）PS-101'>
<label>完了期限 <span class='req'>必須</span></label><input name="deadline" type='date'>
</div>
<label>駐車場 <span class='opt'>任意</span></label><input name="parking" placeholder='例）来客用1台'>
<label>担当者 <span class='req'>必須</span></label><input name="staff">
<label>その他連絡事項 <span class='opt'>任意</span></label>
<textarea name="remarks" placeholder='例）部材は現地保管・〇〇様へ連絡後訪問'></textarea>
<label>写真添付</label><input name="photos" type='file' multiple>
<button>送信</button>
</form>
</div></body></html>
