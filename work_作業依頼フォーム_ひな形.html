<!DOCTYPE html><html lang='ja'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<style>
body{font-family:Meiryo,sans-serif;background:#f3f5f7;margin:0}
.wrap{max-width:700px;margin:20px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
h1{background:#06C755;color:#fff;padding:15px;border-radius:8px}
label{display:block;font-weight:bold;margin-top:14px}
input,select,textarea{width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
textarea{height:90px}
.sec{background:#eef8ef;padding:12px;border-radius:8px;margin-top:18px}
button{width:100%;padding:14px;margin-top:20px;background:#06C755;color:#fff;border:none;border-radius:8px;font-size:18px}
.req{color:#d00}
.opt{color:#777;font-size:.9em}
</style>

<script>
function sw(){
 let v=document.getElementById('occ').value;
 document.getElementById('occ_in').style.display=v=='in'?'block':'none';
 document.getElementById('occ_out').style.display=v=='out'?'block':'none';
}
window.onload=sw;
</script>
</head>
<body><div class='wrap'>
<h1>作業依頼フォーム</h1>
<label>作業内容 <span class='req'>必須</span></label>
<textarea placeholder='例）洗浄便座交換'></textarea>
<label>住所 <span class='req'>必須</span></label><input>
<label>物件名 <span class='req'>必須</span></label><input>
<label>部屋番号 <span class='req'>必須</span></label><input>
<label>入居状況 <span class='req'>必須</span></label>
<select id='occ' onchange='sw()'><option value='in'>入居中</option><option value='out'>空室</option></select>
<div id='occ_in' class='sec'>
<label>入居者名</label><input placeholder='例）山田 太郎'>
<label>電話番号</label><input placeholder='例）090-1234-5678'>
</div>
<div id='occ_out' class='sec'>
<label>オートロック番号</label><input placeholder='例）1234#'>
<label>鍵番号</label><input placeholder='例）PS-101'>
<label>完了期限 <span class='req'>必須</span></label><input type='date'>
</div>
<label>駐車場 <span class='opt'>任意</span></label><input placeholder='例）来客用1台'>
<label>担当者 <span class='req'>必須</span></label><input>
<label>その他連絡事項 <span class='opt'>任意</span></label>
<textarea placeholder='例）部材は現地保管・〇〇様へ連絡後訪問'></textarea>
<label>写真添付</label><input type='file' multiple>
<button>送信</button>
</div></body></html>
